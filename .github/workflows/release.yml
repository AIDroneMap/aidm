# Builds, tests and publishes the AIDM engine images.
#
# A v* tag push publishes ghcr.io/aidronemap/aidm:<version>, :latest,
# :<version>-gpu and :gpu, then opens a draft GitHub release.
#
# Run it by hand to test the build without publishing anything:
#   gh workflow run release.yml -f publish=false
#
# Every night at 00:00 UTC a scheduled run (the nightly) works on master:
#   1. nightly-merge merges the open pull requests that change build inputs
#      (SuperBuild/, Dockerfile, gpu.Dockerfile, docker/, configure.sh,
#      requirements.txt) and are ready: approved by a code owner, every check
#      green, and a passing dry run on their head commit that ran the three
#      builds and the GPU test (scripts/nightly-merge.py). Pull requests that
#      change CI code (.github/, scripts/) are never merged here. Nothing is
#      merged while an issue labelled nightly-failed is open.
#   2. The images are built from master with no cache and tested on the full
#      dataset, the GPU image on Modal too.
#   3. Each build job whose smoke test passed writes the shared build cache.
#   4. A failed nightly opens an issue labelled nightly-failed.
# The build cache is written only by the nightly and by runs that publish.
# A dry run reads it and never writes it, so the cache always matches master
# as of the last nightly.
# Publish again from an existing tag, for example after a failed run:
#   gh workflow run release.yml --ref v0.1.0 -f publish=true
#
# Every run, dry run or tag, also tests the GPU image on a real NVIDIA GPU
# (the gpu-test job). The GitHub runners have no GPU, so the build job only
# proves that the GPU image falls back to the CPU. The build job pushes the
# GPU image by digest (to ghcr.io/aidronemap/aidm-ci on dry runs, untagged),
# and gpu-test runs scripts/gpu-smoke-modal.py, which starts that exact
# digest on a T4 on Modal and checks that the engine used the GPU. Nothing is
# tagged unless gpu-test passes.
#
# gpu-test runs in the modal-gpu deployment environment, which needs:
#   secrets   MODAL_TOKEN_ID, MODAL_TOKEN_SECRET
#   variable  MODAL_ENVIRONMENT, the Modal environment to run in
# It pulls the image with this run's GITHUB_TOKEN; no registry token is
# stored anywhere. A dry run only reaches Modal from a branch that the
# environment's deployment branch rules allow. Each run costs about USD 0.21
# on Modal (a T4, 4 cores and 16 GiB for about 14 minutes at list prices, with
# aidm-vineyard-small); the job log prints an estimate.

name: Release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images. Needs a tag ref. When false, build and test only.
        type: boolean
        default: false

permissions:
  contents: read

# One publishing run per tag and one nightly, never cancelled. A new dry run
# cancels an older one on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' || inputs.publish) && 'publish' || (github.event_name == 'schedule' && 'nightly' || 'dry-run') }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' || inputs.publish || github.event_name == 'schedule') }}

env:
  IMAGE: ghcr.io/aidronemap/aidm
  # Untagged GPU images from dry runs, so that gpu-test can pull them
  CI_IMAGE: ghcr.io/aidronemap/aidm-ci
  # Build cache, one tag per matrix entry. Holds layers only, never an
  # image that gets published. See "Build cache" in the README.
  CACHE_IMAGE: ghcr.io/aidronemap/aidm-buildcache

jobs:
  # The nightly only. Merges the ready pull requests that change build inputs,
  # oldest first, and hands the new master commit to the other jobs.
  nightly-merge:
    name: Merge ready build changes
    if: github.event_name == 'schedule'
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: read
      checks: read
      statuses: read
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # master as of the schedule, which holds scripts/nightly-merge.py
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rules and their tests are in scripts/nightly-merge.py and
      # tests/test_nightly_merge.py
      - name: Merge ready pull requests
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/nightly-merge.py

  check:
    name: Check version
    needs: nightly-merge
    # Runs when nightly-merge is skipped (every run but the nightly) or passed
    if: ${{ !cancelled() && needs.nightly-merge.result != 'failure' }}
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      # publish, nightly or dry-run
      mode: ${{ steps.version.outputs.mode }}
      # The commit every job builds: master after the merges on the nightly,
      # the commit that started the run otherwise
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.nightly-merge.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Read VERSION and compare it with the tag
        id: version
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must look like 1.2.3, found '$version'"
            exit 1
          fi

          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$PUBLISH_INPUT" = "true" ]; then
            publish=true
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version"
              exit 1
            fi
          elif [ "$publish" = "true" ]; then
            echo "::error::Publishing needs a tag. Run: gh workflow run release.yml --ref v$version -f publish=true"
            exit 1
          fi

          mode=dry-run
          if [ "$publish" = "true" ]; then
            mode=publish
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            mode=nightly
          fi

          echo "Version $version, mode $mode, commit $(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    # check depends on nightly-merge, which is skipped on every run but the
    # nightly, and a skipped job earlier in the chain skips every job after
    # it unless the job says when to run. So every job from here on states
    # it, and a run whose builds were skipped can never pass.
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ${{ matrix.runner }}
    # About 1.5 times the measured job time with a full build of the C++
    # dependencies, so a run that misses the build cache still finishes
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: write
    outputs:
      gpu-image: ${{ steps.check-push.outputs.gpu-image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu-amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile
            platform: linux/amd64
            timeout: 100
            smoke-timeout: 36
          - name: cpu-arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
            platform: linux/arm64
            timeout: 70
            smoke-timeout: 25
          # The runner has no GPU, so the smoke test runs this image on the CPU
          - name: gpu-amd64
            runner: ubuntu-24.04
            dockerfile: gpu.Dockerfile
            platform: linux/amd64
            timeout: 135
            smoke-timeout: 54
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.ref }}
          persist-credentials: false

      # Only a run that publishes and the nightly free disk space. The hosted
      # runners have 145 GB disks with about 86 GB free; a full build of the
      # GPU image with no cache grew the disk by about 49 GB (run 40836313546),
      # so a dry run fits without it and saves 1 to 2 minutes per job. The
      # Disk usage step at the end of the job shows what a run used.
      - name: Free disk space
        if: needs.check.outputs.mode != 'dry-run'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /

      - name: Add swap
        run: |
          swapfile=/swapfile
          if mountpoint -q /mnt; then swapfile=/mnt/swapfile; fi
          sudo swapoff -a
          sudo rm -f "$swapfile"
          sudo fallocate -l 10G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h

      # Build timestamps come from the commit, so the pushed image is the tested one
      - name: Set build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # The runner is discarded after the job, so a dry run skips removing the
      # builder at the end (6 to 18 seconds).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: ${{ needs.check.outputs.mode != 'dry-run' }}
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      # Every run but the nightly reads the build cache; only the nightly and
      # runs that publish write it, after the smoke test. The GPU image is
      # also pushed on every run, for gpu-test.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The nightly builds with no cache, so every night proves that master
      # still builds from its sources.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          provenance: false
          load: true
          tags: aidm-smoke:${{ matrix.name }}
          no-cache: ${{ needs.check.outputs.mode == 'nightly' }}
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.name }}

      # About 1.5 times the slowest measured smoke test on this runner, on the
      # full set. A dry run processes the CI set (32 images); the nightly and
      # a run that publishes process the full set (73 images). See
      # scripts/smoke-test.conf.
      - name: Smoke test
        timeout-minutes: ${{ matrix.smoke-timeout }}
        run: scripts/smoke-test.sh engine "aidm-smoke:$NAME"
        env:
          NAME: ${{ matrix.name }}
          SMOKE_DATASET: ${{ needs.check.outputs.mode == 'dry-run' && 'ci' || 'full' }}

      # Only after the smoke test passed. Same inputs as the tested build, so
      # every step comes from this runner's local build cache; mode=max also
      # caches the builder stage, where the SuperBuild layer is.
      - name: Write the build cache
        if: needs.check.outputs.mode != 'dry-run'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.name }},mode=max,image-manifest=true,oci-mediatypes=true

      # Same inputs as the tested build, so every step comes from this runner's
      # local build cache.
      # Dry runs push to CI_IMAGE, by digest only, so nothing is published.
      - name: Push by digest
        id: push
        if: needs.check.outputs.publish == 'true' || matrix.name == 'gpu-amd64'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ needs.check.outputs.publish == 'true' && env.IMAGE || env.CI_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Check that the pushed image is the tested one
        id: check-push
        if: needs.check.outputs.publish == 'true' || matrix.name == 'gpu-amd64'
        env:
          TESTED: ${{ steps.build.outputs.imageid }}
          PUSHED: ${{ steps.push.outputs.imageid }}
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.name }}
          PUSHED_TO: ${{ needs.check.outputs.publish == 'true' && env.IMAGE || env.CI_IMAGE }}
        run: |
          echo "Tested $TESTED, pushed $PUSHED as $PUSHED_TO@$DIGEST"
          scripts/check-pushed-image.sh "$TESTED" "$PUSHED" "$DIGEST"
          mkdir -p digests
          echo "$DIGEST" > "digests/$NAME"
          if [ "$NAME" = "gpu-amd64" ]; then
            echo "gpu-image=$PUSHED_TO@$DIGEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload digest
        if: needs.check.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

      - name: Disk usage
        if: always()
        run: df -h /

  # Runs the GPU image on a real GPU on Modal. See the comment at the top.
  gpu-test:
    name: GPU test on Modal
    needs: [check, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-24.04
    # About 1.5 times the measured 16 to 18 minutes, Modal image build included
    timeout-minutes: 30
    environment: modal-gpu
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.ref }}
          persist-credentials: false

      - name: Install the Modal client
        run: |
          python3 -m venv "$RUNNER_TEMP/modal"
          "$RUNNER_TEMP/modal/bin/pip" install --quiet modal==1.6.2

      # The Sandbox lives at most 20 minutes (SMOKE_TIMEOUT, about 1.5 times the
      # measured 804 s on the full set) and is not retried. Same dataset rule as
      # the smoke test: the CI set on a dry run, the full set otherwise.
      # Builder 2025.06 adds nothing to a registry image, so the engine keeps
      # its own Python.
      - name: Run the engine on a GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT }}
          MODAL_IMAGE_BUILDER_VERSION: "2025.06"
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_GPU: T4
          SMOKE_TIMEOUT: "1200"
          SMOKE_DATASET: ${{ needs.check.outputs.mode == 'dry-run' && 'ci' || 'full' }}
          GPU_IMAGE: ${{ needs.build.outputs.gpu-image }}
        run: '"$RUNNER_TEMP/modal/bin/python" scripts/gpu-smoke-modal.py "$GPU_IMAGE"'

  manifest:
    name: Tag images
    needs: [check, build, gpu-test]
    if: ${{ !cancelled() && needs.gpu-test.result == 'success' && needs.check.outputs.publish == 'true' }}
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    outputs:
      cpu-digest: ${{ steps.tag.outputs.cpu-digest }}
      gpu-digest: ${{ steps.tag.outputs.gpu-digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests and tags
        id: tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE@$(cat digests/cpu-amd64)" "$IMAGE@$(cat digests/cpu-arm64)"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION-gpu" -t "$IMAGE:gpu" \
            "$IMAGE@$(cat digests/gpu-amd64)"

          cpu=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          gpu=$(docker buildx imagetools inspect "$IMAGE:$VERSION-gpu" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$VERSION-gpu"
          echo "cpu-digest=$cpu" >> "$GITHUB_OUTPUT"
          echo "gpu-digest=$gpu" >> "$GITHUB_OUTPUT"

  release:
    name: Draft release
    needs: [check, manifest]
    if: ${{ !cancelled() && needs.manifest.result == 'success' && github.event_name == 'push' }}
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Creates or updates a draft. A published release is never touched.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          CPU_DIGEST: ${{ needs.manifest.outputs.cpu-digest }}
          GPU_DIGEST: ${{ needs.manifest.outputs.gpu-digest }}
        run: |
          tag="$GITHUB_REF_NAME"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changelog.md
          if ! grep -q '[^[:space:]]' changelog.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi

          {
            cat changelog.md
            echo
            echo "### Images"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo "docker pull $IMAGE:$VERSION-gpu"
            echo '```'
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| \`$IMAGE:$VERSION\` (amd64, arm64) | \`$CPU_DIGEST\` |"
            echo "| \`$IMAGE:$VERSION-gpu\` (amd64) | \`$GPU_DIGEST\` |"
          } > notes.md

          if is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $tag is already published. Not changing it."
              exit 1
            fi
            gh release edit "$tag" --draft --notes-file notes.md
          else
            gh release create "$tag" --draft --verify-tag --title "AIDM $VERSION" --notes-file notes.md
          fi

  # The nightly only: opens an issue when any job failed. While it is open,
  # nightly-merge merges nothing.
  nightly-report:
    name: Report a failed nightly
    needs: [nightly-merge, check, build, gpu-test]
    if: github.event_name == 'schedule' && failure()
    # Runner images are pinned on purpose. Moving to a new image is its own PR, with a full dry run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGED: ${{ needs.nightly-merge.outputs.merged }}
          SHA: ${{ needs.nightly-merge.outputs.sha }}
        run: |
          gh label create nightly-failed --color B60205 \
            --description "The nightly build of master failed; the nightly merges nothing until this is closed" \
            2> /dev/null || true
          {
            echo "The nightly build of master failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Commit built: ${SHA:-unknown}"
            echo "Pull requests merged tonight: ${MERGED:-none}"
            echo
            echo "The build cache was not written by the jobs that failed. The nightly merges nothing until this issue is closed. Close it once master builds again."
          } > body.md
          gh issue create --title "Nightly build failed on $(date -u +%Y-%m-%d)" \
            --label nightly-failed --body-file body.md

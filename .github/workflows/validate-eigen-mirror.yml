# Temporary proof for issue #45. Remove before hand-off.
name: Validate Eigen mirror

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/validate-eigen-mirror.yml]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: GitLab blocked, ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu-amd64
            dockerfile: Dockerfile
          - name: gpu-amd64
            dockerfile: gpu.Dockerfile
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Record the tested tree and build inputs
        run: |
          git rev-parse HEAD | tee tested-head.txt
          git ls-tree -r HEAD -- SuperBuild configure.sh requirements.txt docker Dockerfile gpu.Dockerfile scripts tests > tested-inputs.txt

      - name: Run the SuperBuild regression tests on the runner
        run: python3 -m unittest discover tests 'test_eigen_mirror.py' -v

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /

      - name: Add swap
        run: |
          swapfile=/swapfile
          if mountpoint -q /mnt; then swapfile=/mnt/swapfile; fi
          sudo swapoff -a
          sudo rm -f "$swapfile"
          sudo fallocate -l 10G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"

      - name: Build without cache with GitLab blocked
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          NAME: ${{ matrix.name }}
        run: |
          # The only Dockerfile addition records Git transport commands.
          awk '{print} /^FROM .* AS builder$/ {print "ENV GIT_TRACE=1"}' "$DOCKERFILE" > "$RUNNER_TEMP/eigen-proof.Dockerfile"
          docker build --no-cache --progress=plain --platform linux/amd64 \
            --add-host gitlab.com:127.0.0.1 \
            -f "$RUNNER_TEMP/eigen-proof.Dockerfile" \
            -t "aidm-eigen-proof:$NAME" . 2>&1 | tee build.log

      - name: Check that no GitLab fetch was attempted
        if: always()
        run: |
          test -s build.log
          if grep -in 'gitlab\.com' build.log; then
            echo "::error::The image build log names a GitLab request."
            exit 1
          fi
          grep -F 'https://github.com/AIDroneMap/aidm-eigen-mirror.git' build.log
          grep -F '3147391d946bb4b6c68edd901f2add6ac1f31f8c' build.log
          grep -F '477d1e81928a8514d2cca6a6e1e7e478eecd8634' build.log
          grep -F '7176ae16238ded7fb5ed30a7f5215825b3abd134' build.log

      - name: Run the pinned-dataset full smoke test
        env:
          NAME: ${{ matrix.name }}
        run: scripts/smoke-test.sh engine "aidm-eigen-proof:$NAME" 2>&1 | tee smoke.log

      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eigen-proof-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            tested-head.txt
            tested-inputs.txt
            build.log
            smoke.log
          if-no-files-found: error
          retention-days: 14

      - name: Report the result on the current pull request head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RESULT: ${{ job.status }}
          NAME: ${{ matrix.name }}
        run: |
          # The temporary workflow is removed while this retained run executes.
          # Report against the current head only when the rest of its tree matches.
          git fetch origin "$BRANCH"
          git ls-tree -r HEAD | grep -v $'\t.github/workflows/validate-eigen-mirror.yml$' > tested-tree.txt
          git ls-tree -r FETCH_HEAD | grep -v $'\t.github/workflows/validate-eigen-mirror.yml$' > current-tree.txt
          state=failure
          if diff -u tested-tree.txt current-tree.txt && [ "$RESULT" = success ]; then
            state=success
          fi
          sha=$(git rev-parse FETCH_HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f state="$state" -f context="Eigen mirror proof, $NAME" \
            -f description="No-cache build with GitLab blocked and pinned-dataset smoke test" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

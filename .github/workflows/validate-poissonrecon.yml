# Validation of the PoissonRecon fix for issue #24, on all three images.
#
# Each job builds its image from source with no build cache, so every C++
# dependency is compiled in the run. It then processes Brighton Beach (18
# images) with the engine and checks the outputs, the georeferencing and
# that PoissonRecon was not retried.
#
# Then it runs PoissonRecon on the point cloud of that run, with the
# arguments odm_meshing passes, RUNS times for each binary:
#   shipped    the PoissonRecon in the image, built by the SuperBuild
#   plain      the same pinned source, built in the same builder stage
#              with the same command, without SANITIZED_PR (the build
#              before #43; the CPU jobs only)
#   sanitized  the same, with CFLAGS=-DSANITIZED_PR (the CPU jobs only)
# A run passes when PoissonRecon exits 0 and writes its mesh. The job fails
# if a shipped or sanitized run fails. The plain build is the control: on
# arm64 it is expected to abort with "Failed to close loop".
#
# No job runs on Modal or another outside service, and the GPU image runs on
# the CPU here. The only outside call is the push below, to GitHub's registry.
#
# The cpu-arm64 job then pushes its image to ghcr.io/aidronemap/aidm-ci by
# digest, untagged, so the same image can be tested on other arm64
# machines. It pushes only after all its checks passed, and it is the only
# job with packages: write. Its digest is in its step summary.
#
# The steps live in validate-poissonrecon-job.yml. Started by hand, the
# "jobs" input runs all three jobs or cpu-arm64 alone.

name: Validate PoissonRecon

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/validate-poissonrecon.yml
      - .github/workflows/validate-poissonrecon-job.yml
  workflow_dispatch:
    inputs:
      jobs:
        description: Jobs to run
        type: choice
        options:
          - all
          - cpu-arm64
        default: all

concurrency:
  group: validate-poissonrecon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-arm64:
    name: cpu-arm64
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/validate-poissonrecon-job.yml
    with:
      name: cpu-arm64
      runner: ubuntu-24.04-arm
      dockerfile: Dockerfile
      rebuild: true
      push: true
      # About 1.5 times a passing job, plus three build retries
      timeout: 240

  amd64:
    name: ${{ matrix.name }}
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu-amd64
            dockerfile: Dockerfile
            rebuild: true
            timeout: 260
          - name: gpu-amd64
            dockerfile: gpu.Dockerfile
            rebuild: false
            timeout: 260
    uses: ./.github/workflows/validate-poissonrecon-job.yml
    with:
      name: ${{ matrix.name }}
      runner: ubuntu-24.04
      dockerfile: ${{ matrix.dockerfile }}
      rebuild: ${{ matrix.rebuild }}
      timeout: ${{ matrix.timeout }}

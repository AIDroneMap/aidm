# Settings shared by scripts/smoke-test.sh and scripts/gpu-smoke-modal.py,
# so that both test the same dataset and check the same outputs.
#
# Keep to plain KEY="value" lines: the shell sources this file and Python
# parses it with shlex. No variables, no commands.
#
# Datasets. Two pinned sets of the same survey, a vineyard flown with a DJI
# Mavic 3M, 5280 x 3956 pixel RGB images with RTK corrected positions.
# Licence: CC BY 4.0, https://creativecommons.org/licenses/by/4.0/
#          Attribution: AIDroneMap, provided by ITALDRONI
# The images are downloaded at run time and never committed to this repository.
#
# SMOKE_DATASET picks the set; the default is ci.
#   ci    aidm-vineyard-ci v1: 32 images, two full flight lines of
#         aidm-vineyard-small v1 (capture positions 34 to 65).
#         Source: https://github.com/AIDroneMap/aidm-data, release vineyard-ci-v1
#         For the smoke test of pull requests, release dry runs and local runs.
#   full  aidm-vineyard-small v1: 73 images.
#         Source: https://huggingface.co/datasets/AIDroneMap/aidm-vineyard-small,
#         the commit that tag v1 resolves to.
#         For every run that publishes a release, and for benchmarks.
#
# Each set is a zip with the images at its root, downloaded from its URL and
# checked against its SHA-256 and image count. Do not change a pin, or add a
# smaller set, to save CI time (see AGENTS.md). A new pin needs a new tag or
# release in the dataset repository.

CI_DATASET_URL="https://github.com/AIDroneMap/aidm-data/releases/download/vineyard-ci-v1/aidm-vineyard-ci-v1.zip"
CI_DATASET_SHA256="e9a0a6ffe425e878ba6417d28ce5aae8a64a653d3791195e848dff4539ec4156"
CI_DATASET_IMAGES="32"

FULL_DATASET_URL="https://huggingface.co/datasets/AIDroneMap/aidm-vineyard-small/resolve/6af198c9a327e187e088ede6d7c632eb77b50eaa/aidm-vineyard-small-v1.zip"
FULL_DATASET_SHA256="db6feb86d55ab580782bf85193cc3e0393fe3f16aa36ec7b15f3d11a6456752f"
FULL_DATASET_IMAGES="73"
# The tag and commit of the pin above, named in the manifest of the golden
# input. The commit is the one in FULL_DATASET_URL.
FULL_DATASET_TAG="v1"
FULL_DATASET_COMMIT="6af198c9a327e187e088ede6d7c632eb77b50eaa"

# Engine options used when SMOKE_OPTIONS is not set
DEFAULT_OPTIONS="--dsm"

# Outputs that must exist and be non-empty, relative to the project folder,
# separated by spaces
OUTPUTS="odm_orthophoto/odm_orthophoto.tif odm_dem/dsm.tif odm_georeferencing/odm_georeferenced_model.laz odm_texturing/odm_textured_model_geo.obj"
